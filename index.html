<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23E3B23C'/%3E%3Ccircle cx='256' cy='270' r='150' fill='%232B2A33'/%3E%3Cpath d='M168 168 L178 98 L232 146 Z M286 140 L330 92 L330 166 Z' fill='%232B2A33'/%3E%3Cpath d='M120 330 C150 420 330 440 392 360' fill='none' stroke='%233E3D48' stroke-width='46' stroke-linecap='round'/%3E%3Cpath d='M196 248 q16 14 32 0 M270 248 q16 14 32 0' fill='none' stroke='%23E3B23C' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E" />
<title>miyo</title>
<style>
  :root {
    --bg: #F6F4F0; --card: #FFFFFF; --ink: #24262B; --muted: rgba(36,38,43,.58); --tertiary: rgba(36,38,43,.3); --sep: rgba(36,38,43,.1); --fill: rgba(118,118,128,.12);
    --accent: #5B8A72; --red: #E5484D;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; padding: calc(var(--safe-top) + 8px) 16px calc(var(--safe-bottom) + 96px); min-height: 100vh; }
  button, input, textarea { font-family: inherit; }
  .shell { max-width: 560px; margin: 0 auto; }

  header { display: flex; align-items: flex-end; justify-content: space-between; margin: 8px 4px 4px; }
  h1 { font-size: 32px; font-weight: 700; letter-spacing: .01em; }
  h1.brand { display: flex; align-items: center; gap: 10px; font-size: 34px; letter-spacing: .02em; }
  h1.brand img { width: 40px; height: 40px; border-radius: 11px; }
  .hbtns { display: flex; gap: 4px; margin-bottom: 4px; }
  .hbtn { height: 36px; min-width: 36px; padding: 0 8px; border: 0; border-radius: 10px; background: none; color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .hbtn:active { background: var(--fill); }
  .hbtn svg { width: 22px; height: 22px; }
  .lead { font-size: 14px; color: var(--muted); margin: 0 4px 16px; }

  /* パターンのタイル（最大8つ・2列×4段） */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { position: relative; border: 0; border-radius: 20px; padding: 16px 14px 14px; min-height: 128px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; color: var(--ink); background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.04); overflow: hidden; transition: transform .12s; }
  .tile:active { transform: scale(.97); }
  .tile::before { content: ''; position: absolute; inset: 0; background: var(--c); opacity: .14; }
  .tile > * { position: relative; }
  .tile .cat svg { width: 54px; height: 54px; display: block; }
  .tile .nm { font-size: 16.5px; font-weight: 700; line-height: 1.35; margin-top: 10px; word-break: break-word; }
  .tile.add { background: none; border: 2px dashed var(--tertiary); box-shadow: none; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; font-weight: 600; gap: 6px; }
  .tile.add::before { display: none; }
  .tile.add b { font-size: 28px; font-weight: 400; color: var(--accent); }
  .empty { background: var(--card); border-radius: 20px; padding: 28px 22px; text-align: center; line-height: 1.8; color: var(--muted); font-size: 15px; }
  .empty h2 { font-size: 18px; color: var(--ink); margin-bottom: 8px; }
  .empty .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .pbtn { border: 0; border-radius: 14px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; padding: 14px; cursor: pointer; }
  .gbtn { border: 0; border-radius: 14px; background: var(--fill); color: var(--ink); font-size: 15px; font-weight: 600; padding: 13px; cursor: pointer; }
  .limit { font-size: 12px; color: var(--muted); text-align: center; margin-top: 12px; }

  .data { margin-top: 30px; }
  .data h3 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 4px 6px; }
  .data-card { background: var(--card); border-radius: 14px; overflow: hidden; }
  .data-card button { display: block; width: 100%; text-align: left; border: 0; border-bottom: .5px solid var(--sep); background: none; padding: 14px 16px; font-size: 16px; color: var(--accent); cursor: pointer; }
  .data-card button:last-child { border-bottom: 0; }
  .note { font-size: 12px; color: var(--muted); margin: 8px 6px 0; line-height: 1.6; }
  footer { text-align: center; color: var(--tertiary); font-size: 12px; margin-top: 22px; }

  /* パターンを開いた画面（全画面） */
  .view { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; transform: translateY(100%); transition: transform .32s cubic-bezier(.32,.72,0,1); }
  .view.show { transform: translateY(0); }
  .v-head { position: relative; padding: calc(var(--safe-top) + 10px) 16px 22px; overflow: hidden; }
  .v-head::before { content: ''; position: absolute; inset: 0; background: var(--c); opacity: .2; }
  .v-head > * { position: relative; }
  .v-nav { display: flex; justify-content: space-between; align-items: center; max-width: 560px; margin: 0 auto 10px; }
  .v-nav button { border: 0; background: rgba(255,255,255,.7); border-radius: 999px; height: 36px; padding: 0 14px; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .v-title { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .v-title .cat svg { width: 60px; height: 60px; display: block; }
  .v-title h2 { font-size: 24px; font-weight: 800; line-height: 1.3; }
  .v-body { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(var(--safe-bottom) + 40px); }
  .dur { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 20px; }
  .dur .ic { font-size: 22px; }
  .dur .t { font-size: 13px; color: var(--muted); }
  .dur b { display: block; font-size: 18px; color: var(--ink); }
  .tile .dt { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; padding: 6px 8px calc(var(--safe-bottom) + 4px); background: rgba(246,244,240,.92); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-top: .5px solid var(--sep); }
  .tabs button { flex: 1; max-width: 140px; border: 0; background: none; padding: 4px 0 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: rgba(36,38,43,.42); cursor: pointer; white-space: nowrap; }
  .tabs svg { width: 26px; height: 26px; display: block; }
  .tabs button.on { color: var(--accent); }
  #tabP, #tabK, #tabV, #tabM { padding-top: 8px; }
  .sec { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 4px 8px; }
  .tend { background: var(--card); border-radius: 16px; padding: 6px 16px; margin-bottom: 20px; border-left: 4px solid var(--c); }
  .tend li { list-style: none; font-size: 16.5px; line-height: 1.55; padding: 9px 0; border-bottom: .5px solid var(--sep); }
  .tend li:last-child { border-bottom: 0; }
  .acts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .act { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; padding: 14px 14px; }
  .act .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--c); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .act .tx { flex: 1; min-width: 0; font-size: 17px; line-height: 1.45; word-break: break-word; }
  .none { color: var(--muted); font-size: 14.5px; padding: 4px 4px 18px; }
  /* はじまり・おわり */
  .run { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 20px; }
  .run .st { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .run .st b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .run .st span { font-size: 13px; color: var(--muted); }
  .rbtn { width: 100%; border: 0; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 700; color: #fff; background: var(--c); cursor: pointer; }
  .rbtn.end { background: var(--ink); }
  .rnote { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }
  .now { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 18px; padding: 12px 12px 12px 12px; margin-bottom: 14px; border: 2px solid var(--c); cursor: pointer; }
  .now svg { width: 46px; height: 46px; display: block; flex: none; }
  .now .tx { flex: 1; min-width: 0; }
  .now .tx small { display: block; font-size: 12px; color: var(--muted); }
  .now .tx b { display: block; font-size: 16px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now .tx span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .now button { flex: none; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 700; padding: 9px 14px; cursor: pointer; }
  .tile .badge { position: absolute; top: 12px; right: 12px; background: var(--c); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .tile .badge::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #fff; margin-right: 4px; vertical-align: 1px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .past { margin-top: 24px; }
  .stat { display: flex; gap: 8px; margin-bottom: 8px; }
  .stat div { flex: 1; background: var(--card); border-radius: 14px; padding: 10px 12px; }
  .stat small { display: block; font-size: 11.5px; color: var(--muted); }
  .stat b { font-size: 17px; font-variant-numeric: tabular-nums; }
  .eps { background: var(--card); border-radius: 16px; overflow: hidden; }
  .ep { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: .5px solid var(--sep); cursor: pointer; }
  .ep:last-child { border-bottom: 0; }
  .ep svg { width: 34px; height: 34px; flex: none; display: block; }
  .ep .tx { flex: 1; min-width: 0; }
  .ep .tx b { display: block; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ep .tx span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ep .du { flex: none; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ep .du.on { color: var(--accent); }
  .mon { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 4px 8px; }
  .sum { background: var(--card); border-radius: 16px; padding: 4px 14px; }
  .sum .r { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: .5px solid var(--sep); }
  .sum .r:last-child { border-bottom: 0; }
  .sum svg { width: 34px; height: 34px; display: block; }
  .sum .nm { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .sum .bar { height: 6px; border-radius: 3px; background: var(--fill); margin-top: 5px; overflow: hidden; }
  .sum .bar i { display: block; height: 100%; background: var(--c); border-radius: 3px; }
  .sum .v { text-align: right; font-size: 12px; color: var(--muted); line-height: 1.5; font-variant-numeric: tabular-nums; }
  .sum .v b { font-size: 15px; color: var(--ink); }
  .range { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin-bottom: 10px; }
  .range button { flex: 1; border: 0; background: none; padding: 6px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .range button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .dt-in { width: 100%; border: 0; border-radius: 12px; background: var(--card); padding: 12px 14px; font-size: 17px; color: var(--ink); -webkit-appearance: none; appearance: none; min-height: 48px; }
  .clr { border: 0; background: none; color: var(--accent); font-size: 14px; padding: 8px 4px 0; cursor: pointer; }
  /* miyoのこえ */
  .voice { background: var(--card); border-radius: 22px; padding: 22px 18px 18px; margin-bottom: 18px; text-align: center; }
  .bubble { position: relative; background: #FBF3DF; border-radius: 20px; padding: 18px 18px; font-size: 18px; line-height: 1.7; font-weight: 600; min-height: 92px; display: flex; align-items: center; justify-content: center; white-space: pre-wrap; word-break: break-word; transition: opacity .2s; }
  .bubble.dim { color: var(--muted); font-weight: 500; font-size: 15px; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); border: 12px solid transparent; border-top-color: #FBF3DF; border-bottom: 0; }
  .voice .me { display: block; width: 84px; height: 84px; margin: 20px auto 6px; }
  .voice .who { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .voice .pbtn { width: 100%; background: #2B2A33; }
  .vadd { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
  .vadd textarea.field { flex: 1; min-height: 48px; height: 48px; resize: none; line-height: 1.5; }
  .vadd button { flex: none; height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; padding: 0 16px; cursor: pointer; }
  .vlist { background: var(--card); border-radius: 16px; overflow: hidden; }
  .vrow { padding: 13px 16px; border-bottom: .5px solid var(--sep); font-size: 15.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; cursor: pointer; }
  .vrow:last-child { border-bottom: 0; }
  /* いつ？シート */
  .tsheet { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.32); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .tsheet.show { opacity: 1; pointer-events: auto; }
  .tsheet .pn { width: 100%; max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 18px 16px calc(var(--safe-bottom) + 16px); transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .tsheet.show .pn { transform: none; }
  .tsheet h3 { font-size: 17px; text-align: center; margin-bottom: 4px; }
  .tsheet .sub { font-size: 12.5px; color: var(--muted); text-align: center; margin-bottom: 14px; }
  .tchips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .tchips button { border: 0; border-radius: 12px; background: var(--card); padding: 11px 4px; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .tchips button.on { background: var(--ink); color: #fff; }
  .tsheet .row { display: flex; gap: 8px; margin-top: 14px; }
  .tsheet .row button { flex: 1; border: 0; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .tsheet .cancel { background: var(--fill); color: var(--ink); }
  .tsheet .ok { background: var(--accent); color: #fff; }
  /* メモ */
  .memo { width: 100%; min-height: calc(100vh - 290px); border: 0; border-radius: 16px; background: var(--card); padding: 16px; font-size: 17px; line-height: 1.75; color: var(--ink); outline: none; resize: none; display: block; }
  .memo-st { font-size: 12px; color: var(--muted); margin: 8px 6px 0; min-height: 1.4em; }

  /* 編集 */
  .ed { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; transform: translateX(100%); transition: transform .3s cubic-bezier(.32,.72,0,1); }
  .ed.show { transform: translateX(0); }
  .ed-nav { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: calc(var(--safe-top) + 8px) 12px 8px; background: rgba(246,244,240,.94); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: .5px solid var(--sep); }
  .ed-nav h2 { font-size: 17px; font-weight: 600; }
  .ed-nav button { border: 0; background: none; font-size: 17px; color: var(--accent); cursor: pointer; padding: 6px 8px; }
  .ed-nav button.b { font-weight: 700; }
  .ed-body { max-width: 560px; margin: 0 auto; padding: 14px 16px calc(var(--safe-bottom) + 40px); }
  .lbl { display: block; font-size: 13px; color: var(--muted); margin: 16px 4px 6px; }
  .lbl small { font-size: 12px; opacity: .85; }
  .field { width: 100%; border: 0; border-radius: 12px; background: var(--card); padding: 12px 14px; font-size: 17px; color: var(--ink); outline: none; }
  textarea.field { line-height: 1.6; resize: none; min-height: 110px; }
  .row2 { display: flex; gap: 10px; }
  .durs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .durs button { border: 0; border-radius: 999px; background: var(--card); padding: 7px 12px; font-size: 14px; color: var(--ink); cursor: pointer; }
  .colors { display: flex; gap: 10px; flex-wrap: wrap; }
  .colors button { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .colors button.on { border-color: var(--ink); }
  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 10px; }
  .cats button { border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .cats svg { width: 100%; max-width: 72px; aspect-ratio: 1; display: block; border-radius: 18px; outline: 3px solid transparent; outline-offset: 2px; transition: outline-color .12s; }
  .cats button.on svg { outline-color: var(--ink); }
  .cats button.on { color: var(--ink); font-weight: 600; }
  .order { display: flex; gap: 8px; }
  .order button { flex: 1; border: 0; border-radius: 12px; background: var(--card); padding: 11px; font-size: 15px; color: var(--accent); cursor: pointer; }
  .order button:disabled { color: var(--tertiary); }
  .del { width: 100%; margin-top: 26px; border: 0; border-radius: 13px; background: var(--card); color: var(--red); font-size: 16px; padding: 13px; cursor: pointer; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 76px); transform: translate(-50%, 12px); background: rgba(36,38,43,.92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 90; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  #updateBanner { position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 70px); z-index: 95; display: none; align-items: center; justify-content: center; background: var(--accent); color: #fff; border: 0; border-radius: 14px; padding: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 28px rgba(0,0,0,.25); cursor: pointer; }
</style>
<script>try{navigator.storage&&navigator.storage.persist&&navigator.storage.persisted().then(function(p){if(!p)navigator.storage.persist();});}catch(e){}</script>

<div class="shell">
  <header>

<script>
(() => {
  'use strict';
  const APP_VERSION = '1.7.0';
  const KEY = 'miyo.v1', BK_KEY = 'miyo.lastBackupAt', SCHEMA = 'miyo.v1', MAX = 8;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const COLORS = ['#5B8A72', '#E08A5B', '#D9A23B', '#6C8EBF', '#9B7BC0', '#D4708F', '#4FA3A5', '#8A8F98'];
  const DURS = ['1〜2時間', '半日くらい', '1日', 'ひと晩寝れば', '2〜3日', '1週間くらい'];
  // 猫のポーズ（アイコンと同じ、黒猫×背景色）。C=猫, L=猫の明るい部分, E=目・線（背景色）
  const CATS = [
   ['maru','まるくなる',`<circle cx="50" cy="56" r="28" fill="C"/><path d="M33 40 L34 25 L45 33 Z M55 31 L65 22 L66 37 Z" fill="C"/><path d="M24 66 C30 84 66 88 78 72" fill="none" stroke="L" stroke-width="9" stroke-linecap="round"/><path d="M39 51 q3 3 6 0 M54 51 q3 3 6 0" fill="none" stroke="E" stroke-width="2.4" stroke-linecap="round"/>`],
   ['osuwari','おすわり',`<path d="M68 84 C84 84 86 68 78 62" fill="none" stroke="L" stroke-width="6" stroke-linecap="round"/><ellipse cx="50" cy="70" rx="20" ry="20" fill="C"/><circle cx="50" cy="40" r="17" fill="C"/><path d="M36 33 L37 18 L47 27 Z M53 27 L63 18 L64 33 Z" fill="C"/><circle cx="44" cy="40" r="2.6" fill="E"/><circle cx="56" cy="40" r="2.6" fill="E"/>`],
   ['nozoki','のぞく',`<path d="M20 100 V72 L28 50 L41 63 H59 L72 50 L80 72 V100 Z" fill="C"/><circle cx="40" cy="80" r="7" fill="E"/><circle cx="60" cy="80" r="7" fill="E"/><circle cx="42" cy="81.5" r="3.3" fill="C"/><circle cx="62" cy="81.5" r="3.3" fill="C"/>`],
   ['koubako','香箱すわり',`<ellipse cx="56" cy="66" rx="30" ry="17" fill="C"/><path d="M84 72 C86 86 60 88 46 83" fill="none" stroke="L" stroke-width="6" stroke-linecap="round"/><circle cx="34" cy="54" r="15" fill="C"/><path d="M22 47 L22 33 L32 41 Z M37 40 L45 30 L47 44 Z" fill="C"/><path d="M27 55 h5 M37 55 h5" stroke="E" stroke-width="2.4" stroke-linecap="round"/>`],
   ['nobi','のびー',`<path d="M74 48 Q88 32 80 20" fill="none" stroke="L" stroke-width="5" stroke-linecap="round"/><path d="M28 72 Q52 68 72 50" fill="none" stroke="C" stroke-width="20" stroke-linecap="round"/><path d="M74 52 L80 82 M66 58 L68 82" stroke="C" stroke-width="7" stroke-linecap="round"/><path d="M30 78 L14 84" stroke="C" stroke-width="7" stroke-linecap="round"/><circle cx="23" cy="70" r="12" fill="C"/><path d="M13 65 L12 53 L21 60 Z M25 59 L33 52 L33 64 Z" fill="C"/><path d="M16 71 q2.5 -3 5 0 M24 71 q2.5 -3 5 0" fill="none" stroke="E" stroke-width="2.2" stroke-linecap="round"/>`],
   ['gudee','ぐでー',`<ellipse cx="54" cy="76" rx="34" ry="11" fill="C"/><path d="M86 79 h9" stroke="L" stroke-width="5" stroke-linecap="round"/><ellipse cx="30" cy="70" rx="16" ry="12" fill="C"/><path d="M17 64 L16 54 L25 60 Z M33 59 L41 52 L42 63 Z" fill="C"/><path d="M22 71 h5 M33 71 h5" stroke="E" stroke-width="2.2" stroke-linecap="round"/>`],
   ['iraira','けがさか立つ',`<path d="M76 56 L82 18" stroke="L" stroke-width="7" stroke-linecap="round"/><polygon points="80.0,60.0 74.4,65.6 77.0,73.0 69.5,75.6 68.7,83.5 60.8,82.5 56.7,89.2 50.0,85.0 43.3,89.2 39.2,82.5 31.3,83.5 30.5,75.6 23.0,73.0 25.6,65.6 20.0,60.0 25.6,54.4 23.0,47.0 30.5,44.4 31.3,36.5 39.2,37.5 43.3,30.8 50.0,35.0 56.7,30.8 60.8,37.5 68.7,36.5 69.5,44.4 77.0,47.0 74.4,54.4" fill="C"/><path d="M30 40 L30 20 L42 32 Z M58 32 L70 20 L70 40 Z" fill="C"/><path d="M37 52 L45 56 M63 52 L55 56" stroke="E" stroke-width="2.6" stroke-linecap="round"/><path d="M45 68 q5 -4 10 0" fill="none" stroke="E" stroke-width="2.2" stroke-linecap="round"/>`],
   ['ushiro','うしろすがた',`<ellipse cx="50" cy="70" rx="21" ry="20" fill="C"/><path d="M66 84 C86 82 86 58 76 54" fill="none" stroke="L" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="40" r="16" fill="C"/><path d="M36 34 L37 19 L47 28 Z M53 28 L63 19 L64 34 Z" fill="C"/>`],
   ['hako','はこの中',`<path d="M30 58 V42 L35 30 L44 39 H56 L65 30 L70 42 V58 Z" fill="C"/><circle cx="43" cy="47" r="4.6" fill="E"/><circle cx="57" cy="47" r="4.6" fill="E"/><circle cx="44" cy="48" r="2.2" fill="C"/><circle cx="58" cy="48" r="2.2" fill="C"/><path d="M20 56 H80 L76 86 H24 Z" fill="L"/><path d="M20 56 L12 46 H38 L42 56 Z M80 56 L88 46 H62 L58 56 Z" fill="C"/>`],
   ['hesoten','へそ天',`<path d="M78 64 Q92 58 88 46" fill="none" stroke="L" stroke-width="5" stroke-linecap="round"/><ellipse cx="54" cy="64" rx="27" ry="17" fill="C"/><ellipse cx="56" cy="60" rx="13" ry="7" fill="L"/><path d="M44 50 L41 36 M62 50 L65 36" stroke="C" stroke-width="7" stroke-linecap="round"/><circle cx="25" cy="64" r="13" fill="C"/><path d="M14 72 L8 82 L19 77 Z M26 77 L30 87 L34 75 Z" fill="C"/><path d="M19 61 q2.5 3 5 0 M27 61 q2.5 3 5 0" fill="none" stroke="E" stroke-width="2.2" stroke-linecap="round"/>`],
   ['kakusu','かおをかくす',`<ellipse cx="50" cy="74" rx="22" ry="18" fill="C"/><circle cx="50" cy="44" r="20" fill="C"/><path d="M33 36 L34 18 L46 28 Z M54 28 L66 18 L67 36 Z" fill="C"/><ellipse cx="41" cy="48" rx="8" ry="7" fill="L"/><ellipse cx="59" cy="48" rx="8" ry="7" fill="L"/>`],
   ['hashiru','はしる',`<path d="M30 52 Q14 42 20 28" fill="none" stroke="L" stroke-width="5" stroke-linecap="round"/><path d="M34 62 L16 70 M40 64 L32 82 M62 62 L74 78 M66 58 L84 64" stroke="C" stroke-width="6" stroke-linecap="round"/><ellipse cx="50" cy="57" rx="22" ry="11" fill="C"/><circle cx="74" cy="46" r="12" fill="C"/><path d="M66 40 L66 27 L75 35 Z M77 35 L86 28 L85 41 Z" fill="C"/><circle cx="78" cy="46" r="2.4" fill="E"/>`],
  ];
  const catSvg = (key, color) => { const c = CATS.find((x) => x[0] === key) || CATS[0]; return '<svg viewBox="0 0 100 100" aria-label="' + c[1] + '"><rect width="100" height="100" rx="24" fill="' + color + '"/>' + c[2].replace(/"C"/g, '"#2B2A33"').replace(/"L"/g, '"#46454F"').replace(/"E"/g, '"' + color + '"') + '</svg>'; };
  const _CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // データ：{ patterns: [{ id, name, cat, color, tend:[], acts:[{ id, text }], dur, updatedAt }], eps: [{ id, pid, start, end|null, updatedAt }], voices: [{ id, text, updatedAt }], memo: { text, updatedAt } }
  // ※ v1.0.0 の signs は tend に引き継ぐ（キー・スキーマ名は変えない）
  function norm(d) {
    d.patterns.forEach((p, i) => { if (!p.cat) p.cat = CATS[i % CATS.length][0]; if (!Array.isArray(p.tend)) p.tend = Array.isArray(p.signs) ? p.signs : []; p.acts = p.acts || []; p.dur = p.dur || ''; });
    d.eps = Array.isArray(d.eps) ? d.eps : [];
    d.voices = Array.isArray(d.voices) ? d.voices : [];
    d.memo = d.memo && typeof d.memo.text === 'string' ? d.memo : { text: '', updatedAt: 0 };
    return d;
  }
  function load() { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.patterns)) return norm(d); } catch (e) {} return norm({ patterns: [] }); }
  let data = load();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
  const pById = (id) => data.patterns.find((p) => p.id === id);

  const SAMPLES = [
    { name: '疲れて何もしたくない', cat: 'gudee', color: '#6C8EBF', dur: 'ひと晩寝れば', tend: ['返事を打つのがおっくうになる', 'ソファから動けなくなる', '甘いものばかり欲しくなる'], acts: ['水を1杯飲む', '15分だけ横になる', '今日の予定を1つ減らす'] },
    { name: '頭がいっぱいでイライラ', cat: 'iraira', color: '#E08A5B', dur: '1〜2時間', tend: ['小さな音や返事にイラッとする', 'やることを考えると胸がざわざわする'], acts: ['気になっていることを全部書き出す', '5分外を歩く', '一番小さいことを1つだけ片づける'] },
    { name: '人に会って消耗した', cat: 'kakusu', color: '#9B7BC0', dur: '半日くらい', tend: ['会話を何度も思い返してしまう', '家に帰っても落ち着かない'], acts: ['通知を1時間切る', 'あたたかい飲み物を飲む', '明日の朝の予定を軽くする'] },
  ].map((s) => ({ ...s, acts: s.acts.map((t) => ({ text: t })) }));
  function addPattern(p) {
    const now = Date.now();
    const np = { id: uid(), name: p.name, cat: p.cat || CATS[data.patterns.length % CATS.length][0], color: p.color || COLORS[data.patterns.length % COLORS.length], dur: p.dur || '', tend: p.tend || [], acts: (p.acts || []).map((a) => ({ id: uid(), text: a.text })), updatedAt: now };
    data.patterns.push(np); return np;
  }

  // ---------- ホーム ----------
  function renderHome() {
    renderNow();
    const el = $('home');
    if (!data.patterns.length) {
      el.innerHTML = '<div class="empty"><h2>なにかあったときに、見るところ</h2>疲れたときや調子がくずれたときの<br>よくあるパターンごとに、<br>自分がどうなるか・おすすめの行動・<br>どのくらい続くかをまとめておけます。<br>パターンは8つまで。<div class="btns"><button class="pbtn" id="emptyAdd">パターンを作る</button><button class="gbtn" id="emptySample">例を3つ入れて試す</button></div></div>';
      return;
    }
    let h = '<div class="grid">' + data.patterns.map((p) =>
      '<button class="tile" style="--c:' + p.color + '" data-open="' + p.id + '">' + (active() && active().pid === p.id ? '<span class="badge">いま</span>' : '') + '<span class="cat">' + catSvg(p.cat, p.color) + '</span><span><div class="nm">' + esc(p.name) + '</div>' + (p.dur ? '<div class="dt">⏳ ' + esc(p.dur) + '</div>' : '') + '</span></button>').join('');
    if (data.patterns.length < MAX) h += '<button class="tile add" id="addTile"><b>＋</b>パターンを追加</button>';
    h += '</div>';
    if (data.patterns.length >= MAX) h += '<p class="limit">パターンは8つまでです。似ているものはまとめるのがおすすめ。</p>';
    el.innerHTML = h;
  }
  $('home').addEventListener('click', (e) => {
    if (e.target.closest('#emptyAdd') || e.target.closest('#addTile')) return openEdit(null);
    if (e.target.closest('#emptySample')) { SAMPLES.forEach(addPattern); save(); renderHome(); toast('例を入れました。編集で書きかえられます'); return; }
    const t = e.target.closest('[data-open]'); if (t) openView(t.dataset.open);
  });

  // ---------- パターンを開く ----------
  let curId = null;
  function renderView() {
    const p = pById(curId); if (!p) return;
    const v = $('view'); v.style.setProperty('--c', p.color);
    $('vCat').innerHTML = catSvg(p.cat, p.color); $('vName').textContent = p.name;
    renderRun(p); renderPast(p);
    $('vDur').style.display = p.dur ? '' : 'none'; $('vDurT').textContent = p.dur || '';
    $('vTend').style.display = p.tend.length ? '' : 'none';
    $('vTend').innerHTML = p.tend.map((s) => '<li>' + esc(s) + '</li>').join('');
    $('vTend').previousElementSibling.style.display = p.tend.length ? '' : 'none';
    $('vActs').innerHTML = p.acts.length ? p.acts.map((a, i) => '<div class="act"><span class="n">' + (i + 1) + '</span><span class="tx">' + esc(a.text) + '</span></div>').join('')
      : '<div class="none">「編集」から、おすすめの行動を書いておきましょう</div>';
  }
  function openView(id) { curId = id; renderView(); $('view').scrollTop = 0; $('view').classList.add('show'); }
  function closeView() { $('view').classList.remove('show'); curId = null; renderHome(); }
  $('vClose').onclick = closeView;
  $('vEdit').onclick = () => openEdit(curId);

    return new Promise((resolve) => {
      const bg = document.createElement('div');
      bg.style.cssText = 'position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;padding:24px';
      bg.innerHTML = '<div style="width:100%;max-width:330px;background:#fff;color:#1c1c1e;border-radius:18px;padding:20px 20px 12px"><div style="font-size:16px;font-weight:700;margin-bottom:6px">バックアップは保存できましたか？</div><div style="font-size:14px;line-height:1.6;color:#6e6e73">保存できていれば、前回のバックアップ日を更新します。</div><div style="display:flex;justify-content:flex-end;gap:4px;margin-top:12px"><button data-v="0" style="border:0;background:none;font-size:15px;padding:10px 12px;color:#6e6e73">やめた</button><button data-v="1" style="border:0;background:none;font-size:15px;font-weight:700;padding:10px 12px;color:#007aff">保存できた</button></div></div>';
      bg.addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (!b) return; bg.remove(); resolve(b.dataset.v === '1'); });
      document.body.appendChild(bg);
    });
  }
  async function bkSave(text) {
    const d = new Date(), name = 'miyo_' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json';
    if (navigator.maxTouchPoints > 0) {
      try { const file = new File([text], name, { type: 'application/json' }); if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return 'ok'; } }
      catch (e) { if (e && e.name === 'AbortError') return (await bkAskSaved()) ? 'ok' : 'cancel'; }
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
    return 'ok';
  }
  $('exportBtn').onclick = async () => {
    if (await bkSave(JSON.stringify({ schema: SCHEMA, exportedAt: new Date().toISOString(), patterns: data.patterns, eps: data.eps, voices: data.voices, memo: data.memo }, null, 2)) !== 'ok') return;
    try { localStorage.setItem(BK_KEY, String(Date.now())); } catch (e) {}
    renderBk(); toast('書き出しました');
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').addEventListener('change', async (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const inc = JSON.parse(await f.text());
      if (inc.schema !== SCHEMA || !Array.isArray(inc.patterns)) { toast('miyoのデータではないようです'); return; }
      const byId = new Map(data.patterns.map((p) => [p.id, p]));
      for (const p of inc.patterns) { const l = byId.get(p.id); if (!l || (p.updatedAt || 0) > (l.updatedAt || 0)) byId.set(p.id, p); }
      data.patterns = [...byId.values()].slice(0, MAX);
      if (inc.memo && typeof inc.memo.text === 'string' && (inc.memo.updatedAt || 0) > (data.memo.updatedAt || 0)) data.memo = inc.memo;
      const eById = new Map(data.eps.map((x) => [x.id, x]));
      (inc.eps || []).forEach((x) => { const l = eById.get(x.id); if (!l || (x.updatedAt || 0) > (l.updatedAt || 0)) eById.set(x.id, x); });
      const vById = new Map(data.voices.map((x) => [x.id, x]));
      (inc.voices || []).forEach((x) => { const l = vById.get(x.id); if (!l || (x.updatedAt || 0) > (l.updatedAt || 0)) vById.set(x.id, x); });
      data.voices = [...vById.values()];
      const pids = new Set(data.patterns.map((x) => x.id)); data.eps = [...eById.values()].filter((x) => pids.has(x.pid));
      norm(data);
      save(); renderHome(); renderMemo(); if (!$('tabK').hidden) renderKiroku(); if (!$('tabV').hidden) { pickVoice(); renderVoices(); } toast('取り込みました');
    } catch (err) { toast('読み込めないファイルです'); }
  });

  let tT; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 2200); }

  $('ver').textContent = 'miyo v' + APP_VERSION;
  renderHome(); renderBk();
  try { const t0 = localStorage.getItem(TAB_KEY); setTab(['m', 'k', 'v'].includes(t0) ? t0 : 'p'); } catch (e) { setTab('p'); }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { renderHome(); if (curId) renderView(); if (!$('tabK').hidden) renderKiroku(); } });
  setInterval(() => { if (document.visibilityState !== 'visible' || !active()) return; renderNow(); if (curId) renderRun(pById(curId)); }, 30000);

  // ---------- 自動アップデート ----------
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    addEventListener('load', async () => {
      try {
        const reg = await navigator.serviceWorker.register('sw.js');
        const show = (w) => { const b = $('updateBanner'); b.style.display = 'flex'; b.onclick = () => { b.textContent = '更新中…'; w.postMessage('SKIP_WAITING'); }; };
        if (reg.waiting && navigator.serviceWorker.controller) show(reg.waiting);
        reg.addEventListener('updatefound', () => { const n = reg.installing; if (!n) return; n.addEventListener('statechange', () => { if (n.state === 'installed' && navigator.serviceWorker.controller) show(n); }); });
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
        let done = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (done) return; done = true; location.reload(); });
      } catch (e) {}
    });
  }
})();
</script>
<div id="ui-toast" style="position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);background:rgba(28,28,30,.94);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:9000;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center;font-family:inherit"></div>
<div id="ui-ask" style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:9001;padding:24px"><div style="background:#fff;color:#1c1c1e;border-radius:16px;padding:20px 18px 14px;max-width:330px;width:100%;font-family:inherit"><p id="ui-ask-msg" style="margin:0 0 16px;font-size:15px;line-height:1.7;white-space:pre-line;text-align:center"></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" id="ui-ask-no" style="padding:11px;border-radius:10px;border:0;background:rgba(0,0,0,.07);color:inherit;font:inherit;font-size:15px;font-weight:700">やめる</button><button type="button" id="ui-ask-yes" style="padding:11px;border-radius:10px;border:0;background:#E5484D;color:#fff;font:inherit;font-size:15px;font-weight:700">OK</button></div></div></div>
<script>
  // 自前のお知らせ・確認（iPhoneのホーム画面アプリでは alert/confirm が出ないことがあるため）
  let _uiT = 0;
  function uiToast(msg){ const t=document.getElementById('ui-toast'); t.textContent=msg; t.style.opacity='1'; clearTimeout(_uiT); _uiT=setTimeout(()=>{t.style.opacity='0';}, 2400); }
  function uiAsk(msg, yes){ return new Promise(res=>{ const bg=document.getElementById('ui-ask'); document.getElementById('ui-ask-msg').textContent=msg; const y=document.getElementById('ui-ask-yes'), n=document.getElementById('ui-ask-no'); y.textContent=yes||'OK'; bg.style.display='flex'; const done=v=>{ bg.style.display='none'; y.onclick=n.onclick=null; res(v); }; y.onclick=()=>done(true); n.onclick=()=>done(false); }); }
</script>
